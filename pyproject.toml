[project]
name = "vitaldb-hemo"
version = "0.1.0"
description = "VitalDB haemodynamics and Windkessel model identification"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Henry Pigot" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "vitaldb"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
